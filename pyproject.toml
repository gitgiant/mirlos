[project]
name = "mirlos"
version = "0.1.0"
description = "Song requests for house-party DJ sets, bridged into rekordbox via rekordbox.xml"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "ytfetch",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "segno>=1.6",
]

[project.optional-dependencies]
rekordbox = ["pyrekordbox>=0.4"]
analysis = ["sampleminer"]  # BPM/key via SampleMiner (librosa; Beat This! if installed)
dev = ["pytest", "httpx"]

[project.scripts]
mirlos = "mirlos.__main__:main"

[tool.uv.sources]
ytfetch = { path = "../ytfetch", editable = true }
sampleminer = { path = "../sampleminer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirlos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../ytfetch/src", "../sampleminer/src"]
